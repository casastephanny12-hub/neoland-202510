<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw</title>


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black">

    <div class="w-100 h-100 bg-pink-300 absolute left-100 top-100">
        <div class="w-40 h-40 bg-white absolute top-5 left-5">
            <div class="w-20 h-20 bg-black absolute left-11 top-7"></div>
        </div>
        <div class="w-40 h-40 bg-white absolute top-5 right-5">
            <div class="w-20 h-20 bg-black absolute left-11 top-7"></div>
        </div>
        <div class="w-50 h-30 bg-pink-600 absolute left-25 top-50">
            <div class="w-10 h-10 bg-black absolute top-10 left-10"></div>
            <div class="w-10 h-10 bg-black absolute top-10 right-10"></div>
        </div>
        <div class="w-30 h-10 bg-black absolute left-35 bottom-5"></div>
        <div class="w-10 h-40 bg-pink-300 absolute -left-10"></div>
        <div class="w-10 h-40 bg-pink-300 absolute -right-10"></div>
    </div>

    <div class="w-100 h-200 bg-gray-300 absolute rounded-r-xl rounded-l-xl left-300 top-70">
        <div class="w-85 h-195 bg-gray-700 absolute rounded-4xl left-8 top-3"></div>
        <div class="w-40 h-40 absolute bg-green-700 rounded-full left-30 top-30"></div>
        <div class="w-40 h-40 absolute bg-yellow-500 rounded-full left-30 top-80"></div>
        <div class="w-40 h-40 absolute bg-red-500 rounded-full left-30 top-130"></div>
    </div>

     <div class="w-400 h-200 absolute bg-gradient-to-r from-red-400 via-orange-500 to-yellow-500 top-300 left-20 rounded-tl-[700px] rounded-tr-[700px]">
        <div class="w-340 h-180 absolute bg-black right-30 bottom-0 rounded-tl-[700px] rounded-tr-[700px] top"></div>
    </div>

    <div class="w-150 h-120 bg-white absolute absolute left-550 top-100">
        <div
            class="w-110 h-40 absolute bg-transparent bottom-120 right-0 border-l-[300px] border-l-transparent border-r-[300px] border-r-transparent border-b-[200px] border-b-[brown]"></div>"
        <div class="w-45 h-80 bg-orange-500 absolute left-20 bottom-0 rounded-tl-4xl rounded-tr-4xl">
            <div class="w-7 h-7 bg-black absolute radius-5 top-35"></div>
        </div>
        <div class="w-45 h-45 bg-blue-300 absolute left-80 top-45">
            <div class="w-45 h-5 bg-black absolute bottom-22"></div>
            <div class="w-4 h-45 absolute bg-black right-20"></div>
            <div class="w-55 h-5 bg-red-500 absolute bottom-0 -left-4"></div>
            <div></div>

        </div>
    </div>
